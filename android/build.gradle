// Top-level build file where adds configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        maven { url '/opt/maven-repo' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url '/opt/maven-repo' }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
